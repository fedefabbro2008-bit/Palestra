# Giardino · prove automatiche a ogni modifica (repository pubblico: minuti gratuiti).
# Controlla che la pagina pubblicata sia ricostruita dai sorgenti, poi prova modello, funzioni del sito
# (dati, Claude, Telegram, bot, Siri) e interfaccia nel browser da 320 a 430 px.
name: Giardino · prove
on:
  push:
    branches: [main, "claude/**"]
    paths: ["giardino/**", "giardino-netlify/**", ".github/workflows/giardino-test.yml"]
  pull_request:
    paths: ["giardino/**", "giardino-netlify/**", ".github/workflows/giardino-test.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: giardino-${{ github.ref }}
  cancel-in-progress: true
jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: giardino-netlify
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: La pagina pubblicata corrisponde ai sorgenti
        run: |
          node ../giardino/build-app.mjs
          git diff --exit-code -- public netlify/lib || { echo "::error::Esegui node giardino/build-app.mjs e fai il commit dei file generati"; exit 1; }
      - name: Playwright e Chromium
        working-directory: giardino-netlify/test
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Prove
        run: npm test
      - name: Modelli meteo disponibili (solo informativo)
        continue-on-error: true
        run: node test/meteo-modelli.mjs
      - name: Fonti per gli algoritmi (solo informativo)
        continue-on-error: true
        run: node test/sonda-algoritmi.mjs
      - name: Fonti di dati e badge di Netlify (solo informativo)
        continue-on-error: true
        run: |
          node test/fonti-dati.mjs
          cd test && node badge-online.mjs
