name: Giardino - notifiche innaffiatura

on:
  schedule:
    # Ogni 15 minuti: legge i pulsanti premuti su Telegram. Il messaggio del mattino (dalle 7)
    # e l'avviso della sera (dalle 19) partono una sola volta al giorno, all'ora locale.
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      modo:
        description: "prova = invia subito il messaggio del mattino; aggiorna = ricalcola meteo e piano senza inviare; auto = come la pianificazione"
        type: choice
        options: [prova, aggiorna, auto]
        default: prova

permissions:
  contents: write

concurrency:
  group: giardino-notifiche
  cancel-in-progress: false

jobs:
  notifica:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Pulsanti, piano e messaggi Telegram
        run: node giardino/notifica.mjs
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL }}
          MODO: ${{ inputs.modo || 'auto' }}

      - name: Salva lo stato del bot
        run: |
          git add giardino/stato.json giardino/per-app.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Giardino: aggiorna stato del bot"
            for i in 1 2 3; do
              git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && break
              sleep $((i*5))
            done
          fi
