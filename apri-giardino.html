<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Apri Giardino</title>
<style>
:root{--bg:#eef2ee;--surface:#fff;--ink:#17221c;--muted:#5b6a61;--line:#d6ded7;--water:#1b6a9e;color-scheme:light}
@media (prefers-color-scheme: dark){:root{--bg:#0f1512;--surface:#16201a;--ink:#e4ece6;--muted:#93a399;--line:#27342c;--water:#62b2e6;color-scheme:dark}}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;
  min-height:100vh;display:grid;place-items:center;padding:24px max(16px,env(safe-area-inset-left,0px))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:24px;max-width:420px;width:100%;display:flex;flex-direction:column;gap:14px;text-align:center}
h1{margin:0;font-size:1.5rem}
p{margin:0;color:var(--muted);font-size:.95rem}
a.btn{display:block;background:var(--water);color:var(--surface);text-decoration:none;font-weight:700;padding:14px;border-radius:10px}
a.alt{color:var(--water);font-size:.9rem}
code{font-size:.8rem;word-break:break-all;color:var(--muted)}
</style>
</head>
<body>
<div class="card">
  <svg width="44" height="44" viewBox="0 0 32 32" aria-hidden="true" style="margin:0 auto"><path d="M16 3c5 6.5 8 11 8 15a8 8 0 1 1-16 0c0-4 3-8.5 8-15z" fill="var(--water)"/></svg>
  <h1>Giardino</h1>
  <p>Piano di innaffiatura con meteo e Claude.</p>
  <a class="btn" id="go" href="https://fedefabbro2008-bit.github.io/Palestra/giardino/" target="_blank" rel="noopener">Apri l'app</a>
  <p>Sul telefono, una volta aperta: Condividi → <b>Aggiungi a Home</b> per averla come app.</p>
  <code>fedefabbro2008-bit.github.io/Palestra/giardino/</code>
</div>
<script>
  // Prova ad aprire subito l'app; se il visualizzatore blocca il reindirizzamento resta il pulsante.
  try { if (window.top === window.self) location.replace(document.getElementById('go').href); } catch (e) {}
</script>
</body>
</html>
