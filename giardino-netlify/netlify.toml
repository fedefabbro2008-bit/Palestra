# Giardino su Netlify (piano gratuito): app statica in public/, funzioni in netlify/functions/
#   /api/dati           dati dell'app, chiave del connettore, collegamento del bot
#   /mcp/<chiave>       connettore MCP per Claude
#   /api/telegram/*     webhook del bot Telegram (pulsanti immediati)
#   bot (pianificata)   ogni ora: messaggio del mattino, avviso della sera, riepilogo e backup
[build]
  publish = "public"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    Content-Security-Policy = "frame-ancestors 'none'; object-src 'none'; base-uri 'none'; form-action 'none'"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
